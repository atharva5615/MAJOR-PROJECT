
# CivicAI - Alembic Database Migration Configuration

[alembic]

# Migration scripts directory
script_location = %(here)s/migrations

# Add backend directory to Python import path
prepend_sys_path = .

# Path separator for multiple migration locations
path_separator = os

# Database URL is loaded securely from backend/.env
# through migrations/env.py
# Do not store database credentials in this file.


[post_write_hooks]


# Logging configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
